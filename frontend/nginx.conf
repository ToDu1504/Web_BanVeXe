server {
listen 80;
root /usr/share/nginx/html;
index index.html;
# API: chuyển tiếp sang container backend. Trình duyệt chỉ thấy một domain
# nên cookie HttpOnly đăng nhập hoạt động mà không cần cấu hình CORS.
location /api/ {
proxy_pass http://backend:8080;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
}
# React Router: mọi đường dẫn không phải file thật đều trả về index.html.
location / {
try_files $uri $uri/ /index.html;
}
}